<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyCast Pro Football ⚽🔥</title>

  <!-- Ikony aplikacji -->
  <link rel="icon" type="image/png" sizes="48x48" href="https://cdn-icons-png.flaticon.com/128/3322/3322756.png">

  <style>
    /* =========================================
       1. USTAWIENIA GLOBALNE I PEWNE TŁO
       ========================================= */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      min-height: 100vh;
      /* Dwa tła naraz: 1. Ciemny gradient | 2. Zdjęcie stadionu nocą */
      background-image: 
        linear-gradient(135deg, rgba(5, 20, 35, 0.90), rgba(5, 35, 20, 0.85)),
        url('https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-blend-mode: overlay;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
    }

    /* Główna siatka (Dashboard) */
    .dashboard {
      display: flex;
      flex-direction: column; 
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Szklana szafeczka (Glassmorphism) */
    .window {
      background: rgba(16, 24, 40, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }

    .window:hover {
      border-color: rgba(0, 212, 255, 0.5);
    }

    /* =========================================
       2. NAGŁÓWEK GŁÓWNY (.HEADER)
       ========================================= */
    .header {
      display: flex; 
      flex-direction: column; 
      gap: 12px;
      text-align: center;
      background: rgba(0, 0, 0, 0.65); 
    }

    .football-title { 
      font-size: 1.8rem; 
      font-weight: 800; 
      text-transform: uppercase; 
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6); 
    }

    .gold-gradient { color: #ffcc00; }
    .blue-gradient { color: #00d4ff; }

    .live-status {
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 8px; 
      font-weight: bold;
      font-size: 0.85rem;
      background: rgba(255, 0, 0, 0.25); 
      padding: 6px 14px; 
      border-radius: 20px;
      border: 1px solid rgba(255, 51, 51, 0.5);
      width: fit-content;
      margin: 0 auto;
    }

    .pulse-dot { 
      width: 10px; 
      height: 10px; 
      background-color: #ff3333; 
      border-radius: 50%; 
      box-shadow: 0 0 10px #ff3333; 
      animation: pulse-red 1.5s infinite; 
    }

    @keyframes pulse-red { 
      0% { transform: scale(0.9); opacity: 1; } 
      50% { transform: scale(1.2); opacity: 0.5; } 
      100% { transform: scale(0.9); opacity: 1; } 
    }

    /* =========================================
       3. STREFA TYPERA (.VOTING)
       ========================================= */
    .card-title {
      color: #ffcc00;
      font-size: 1.2rem;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .voting-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .team-option {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 14px;
      border-radius: 8px;
    }

    .team-badge {
      width: 28px;
      height: 28px;
      object-fit: contain;
      margin-right: 12px;
    }

    .team-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
      flex: 1;
    }

    .btn-submit {
      background-color: #ffcc00;
      color: #1a1a24;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.9rem;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
    }

    /* =========================================
       4. SZAFECZKI LIGOWE (.LEAGUE-CARD)
       ========================================= */
    .league-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid rgba(0, 212, 255, 0.4);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .league-title {
      color: #00d4ff;
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .match-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      border-radius: 8px;
    }
    /* =========================================
   PASEK HERBÓW W NAGŁÓWKU
   ========================================= */
.header-badges {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px; /* Odstęp między herbami */
  flex-wrap: wrap;
  margin-bottom: 5px;
}

.header-badge-img {
  height: 32px; /* Stała wysokość ikon */
  width: auto;
  object-fit: contain; /* Gwarancja, że herb się nie zniekształci */
  filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
  transition: transform 0.2s ease, filter 0.2s ease;
}

/* Lekkie powiększenie po najechaniu myszką */
.header-badge-img:hover {
  transform: scale(1.15);
  filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.8));
}
  </style>
</head>

<body>
  <div class="dashboard">
    
                <!-- NAGŁÓWEK -->
               <header class="window header">
    <!-- Pasek z herbami / logotypami lig na samej górze nagłówka -->
    <div class="header-badges">
        <img src="ekstraklasa-logo.png" alt="Ekstraklasa" class="header-badge-img">
        <img src="premier-league-logo.png" alt="Premier League" class="header-badge-img">
        <img src="la-liga-logo.png" alt="La Liga" class="header-badge-img">
        <img src="bundesliga-logo.png" alt="Bundesliga" class="header-badge-img">
        <img src="serie-a-logo.png" alt="Serie A" class="header-badge-img">
    </div>

    <div class="football-title">
        <span class="blue-gradient">SKYCAST PRO</span>
        <span class="gold-gradient">FOOTBALL</span>
    </div>

    <div class="live-status">
        <div class="pulse-dot"></div> CENTRUM ANALIZ I SKRÓTÓW LIVE
    </div>
</header>
    <!-- STREFA TYPERA -->
    <div class="window voting">
      <h3 class="card-title">🔥 STREFA TYPERA: FAWORYCI SEZONU</h3>
      <form class="voting-form">
        <div class="team-option">
          <input type="radio" id="team1" name="faworyt" style="accent-color: #00ffcc;">
          <label for="team1" style="display: flex; align-items: center; width: 100%; margin-left: 10px;">
            <img src="https://cdn-icons-png.flaticon.com/128/3322/3322756.png" alt="Herb" class="team-badge">
            <span class="team-name">Real Madryt</span>
          </label>
        </div>
        <button type="button" class="btn-submit">ODDAJ SWÓJ GŁOS</button>
      </form>
    </div>

    <!-- SZAFECZKI LIGOWE -->
    <div class="window league-card" id="ekstraklasa">
      <div class="league-header">
        <div class="league-title">🇵🇱 PKO BP EKSTRAKLASA</div>
      </div>
      <div class="match-row">
        <span>Mecz 1 (Miejsce na herby)</span>
        <span style="color: #ffcc00; font-weight: bold;">-- : --</span>
      </div>
    </div>

    <div class="window league-card" id="premier-league">
      <div class="league-header">
        <div class="league-title">🏴󠁧󠁢󠁥󠁮󠁧󠁿 PREMIER LEAGUE</div>
      </div>
      <div class="match-row">
        <span>Mecz 1 (Miejsce na herby)</span>
        <span style="color: #ffcc00; font-weight: bold;">-- : --</span>
      </div>
    </div>

    <!-- RADAR WIADOMOŚCI (RSS) -->
    <div class="window rss-container" id="radar-wiadomosci">
      <h3 class="card-title" style="color: #00d4ff;">📰 WIADOMOŚCI SPORTOWE LIVE</h3>
      <p style="text-align: center; color: #ccc; font-size: 0.9rem;">Wczytywanie wiadomości...</p>
    </div>

  </div>
</body>
</html>
